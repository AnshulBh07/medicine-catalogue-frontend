<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%" fill="none">
  <!-- Medicine Catalogue Logo Glyph (Transparent Background) -->
  <g transform="rotate(-45 32 32)">
    <!-- Capsule Outline / Body -->
    <rect
      x="20"
      y="11"
      width="24"
      height="42"
      rx="12"
      stroke="currentColor"
      stroke-width="3"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    
    <!-- Central Capsule Divider -->
    <line
      x1="20"
      y1="32"
      x2="44"
      y2="32"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
    />
    
    <!-- Top Half: Medical Cross (Healthcare / Pharmacy) -->
    <rect
      x="26"
      y="20.5"
      width="12"
      height="3"
      rx="1.5"
      fill="currentColor"
    />
    <rect
      x="30.5"
      y="16"
      width="3"
      height="12"
      rx="1.5"
      fill="currentColor"
    />
    
    <!-- Bottom Half: Catalogue Index Lines (Organization / Registry) -->
    <rect
      x="25.5"
      y="37.5"
      width="13"
      height="2.5"
      rx="1.25"
      fill="currentColor"
    />
    <rect
      x="27.5"
      y="43"
      width="9"
      height="2.5"
      rx="1.25"
      fill="currentColor"
    />
  </g>
</svg>
